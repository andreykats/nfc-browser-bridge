name: Release

on:
  push:
    tags: ["v*"]
  # Build the installers as workflow artifacts without publishing a release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            echo "version=$crate" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$crate" ]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $crate" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: |
          cargo build --release -p bridge-app --target aarch64-apple-darwin
          cargo build --release -p bridge-app --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/nfc-browser-bridge \
            target/aarch64-apple-darwin/release/nfc-browser-bridge \
            target/x86_64-apple-darwin/release/nfc-browser-bridge
          lipo -archs target/universal/nfc-browser-bridge
      - run: packaging/macos/bundle.sh target/universal/nfc-browser-bridge "${{ needs.version.outputs.version }}" target/dist --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -t x86_64-pc-windows-msvc && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # crt-static comes from .cargo/config.toml.
      - run: cargo build --release -p bridge-app --target x86_64-pc-windows-msvc
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DExePath=$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\nfc-browser-bridge.exe" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: packaging/windows/*-windows-setup.exe
          if-no-files-found: error

  release:
    needs: [version, macos, windows]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "NFC Browser Bridge ${{ needs.version.outputs.version }}" \
            --generate-notes
