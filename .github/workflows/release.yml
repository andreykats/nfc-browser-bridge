name: Release

# Each run publishes the next release: v<major>.<minor>.N, where N is one past
# the highest existing tag in that series (major.minor from Cargo.toml). The
# tag is only created once the release is published, so failed runs don't use
# up a number.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          base=$(sed -n 's/^version = "\([0-9]*\.[0-9]*\)\..*"/\1/p' Cargo.toml | head -1)
          [ -n "$base" ] || { echo "No workspace version in Cargo.toml" >&2; exit 1; }
          last=$(git ls-remote --tags --refs origin "v$base.*" | sed -E "s#^.*/v$base\.##" | grep -E '^[0-9]+$' | sort -n | tail -1)
          echo "version=$base.$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
      # Stop before building if CHANGELOG.md has no notes for this version.
      - name: Check release notes
        run: scripts/release-notes.sh "${{ steps.v.outputs.version }}"

  # The same checks as CI, on the commit being released. Nothing is published
  # unless they pass.
  tests:
    uses: ./.github/workflows/ci.yml

  macos:
    needs: version
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: |
          rustup toolchain install stable --profile minimal -t aarch64-apple-darwin,x86_64-apple-darwin
          rustup default stable
      - uses: Swatinem/rust-cache@v2
      # BRIDGE_VERSION is what the app shows; Cargo.toml's version still goes
      # into the Windows .exe metadata.
      - name: Stamp version
        shell: bash
        run: sed -i.bak 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml && rm Cargo.toml.bak
      - run: |
          cargo build --release -p bridge-app --target aarch64-apple-darwin
          cargo build --release -p bridge-app --target x86_64-apple-darwin
          mkdir -p target/universal
          lipo -create -output target/universal/nfc-browser-bridge \
            target/aarch64-apple-darwin/release/nfc-browser-bridge \
            target/x86_64-apple-darwin/release/nfc-browser-bridge
          lipo -archs target/universal/nfc-browser-bridge
      - run: packaging/macos/bundle.sh target/universal/nfc-browser-bridge "${{ needs.version.outputs.version }}" target/dist --dmg
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: target/dist/*.dmg
          if-no-files-found: error

  windows:
    needs: version
    runs-on: windows-latest
    env:
      BRIDGE_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal -t x86_64-pc-windows-msvc && rustup default stable
      - uses: Swatinem/rust-cache@v2
      # BRIDGE_VERSION is what the app shows; Cargo.toml's version still goes
      # into the Windows .exe metadata.
      - name: Stamp version
        shell: bash
        run: sed -i.bak 's/^version = ".*"/version = "${{ needs.version.outputs.version }}"/' Cargo.toml && rm Cargo.toml.bak
      # crt-static comes from .cargo/config.toml.
      - run: cargo build --release -p bridge-app --target x86_64-pc-windows-msvc
      - name: Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          & $iscc "/DAppVersion=${{ needs.version.outputs.version }}" `
            "/DExePath=$env:GITHUB_WORKSPACE\target\x86_64-pc-windows-msvc\release\nfc-browser-bridge.exe" `
            packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: packaging/windows/*-windows-setup.exe
          if-no-files-found: error

  release:
    needs: [version, tests, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # The app installs an update only if its .minisig verifies against
      # crates/bridge-app/release-key.pub and its trusted comment names that
      # version and file (install.rs, signed_comment).
      - name: Sign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "The MINISIGN_SECRET_KEY secret is not set" >&2; exit 1; }
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          for f in dist/*; do
            name=$(basename "$f")
            minisign -S -s "$key" -m "$f" -t "nfc-browser-bridge $VERSION $name"
            # -H: the app only accepts prehashed signatures.
            minisign -V -H -p crates/bridge-app/release-key.pub -m "$f"
          done
          ls -l dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/release-notes.sh "${{ needs.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
          gh release create "v${{ needs.version.outputs.version }}" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "NFC Browser Bridge ${{ needs.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"
